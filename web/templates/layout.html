{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{with .Description}}<meta name="description" content="{{.}}">{{end}}
<link rel="canonical" href="{{.Canonical}}">
<meta property="og:title" content="{{.Title}}">
{{with .Description}}<meta property="og:description" content="{{.}}">{{end}}
{{with .OGImage}}<meta property="og:image" content="{{.}}">{{end}}
<meta name="theme-color" content="#111418">
<link rel="icon" href="{{static "img/favicon.svg"}}" type="image/svg+xml">
<link rel="stylesheet" href="{{static "css/app.css"}}">
</head>
<body{{if .Admin}} class="is-admin"{{end}}>
<header class="top">
  <a class="brand" href="/">meme<span>search</span></a>
  <form class="search" action="/" method="get" role="search">
    <input id="q" name="q" type="search" value="{{.Query}}" placeholder="Search text, objects, meaning…" autocomplete="off" autofocus>
    <select name="kind" id="kind" aria-label="Type">
      <option value="">All</option>
      <option value="image"{{if eq .Kind "image"}} selected{{end}}>Images</option>
      <option value="gif"{{if eq .Kind "gif"}} selected{{end}}>GIFs</option>
      <option value="video"{{if eq .Kind "video"}} selected{{end}}>Videos</option>
    </select>
  </form>
  <nav>
    {{if .Admin}}
      <a href="/admin">Admin</a>
      <a href="/admin/upload">Upload</a>
      <form action="/logout" method="post" class="inline"><button class="link">Logout</button></form>
    {{end}}
  </nav>
</header>
{{if .Admin}}
<nav class="subnav">
  <a href="/admin">Dashboard</a>
  <a href="/admin/upload">Upload &amp; import</a>
  <a href="/admin/memes">Memes</a>
  <a href="/admin/memes?status=failed">Failed</a>
  <a href="/admin/codex">Codex sessions</a>
  <a href="/admin/settings">Settings</a>
</nav>
{{end}}
<main>
{{template "content" .}}
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="{{static "js/app.js"}}" defer></script>
{{if .Admin}}<script src="{{static "js/admin.js"}}" defer></script>{{end}}
</body>
</html>{{end}}
