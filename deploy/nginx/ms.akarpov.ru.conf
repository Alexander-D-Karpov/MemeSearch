upstream memesearch_web {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ms.akarpov.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ms.akarpov.ru;

    ssl_certificate     /etc/letsencrypt/live/ms.akarpov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ms.akarpov.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Media straight from the external drive (MEDIA_HOST_DIR), never through the app
    location ^~ /media/originals/ {
        alias /mnt/memes/originals/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin *;
        sendfile on;
        tcp_nopush on;
    }

    location ^~ /media/thumbs/ {
        alias /mnt/memes/thumbs/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin *;
    }

    location ^~ /media/ {
        return 404;
    }

    # Batched multi-file uploads: stream to the app, no buffering on disk
    location = /api/v1/admin/upload {
        client_max_body_size 32g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://memesearch_web;
    }

    # Big ZIP imports
    location = /api/v1/admin/import/zip {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_pass http://memesearch_web;
    }

    location /static/ {
        proxy_pass http://memesearch_web;
        expires 7d;
    }

    location / {
        proxy_pass http://memesearch_web;
        proxy_read_timeout 120s;
    }
}
