name: memesearch

x-python: &python
  build: ./worker
  image: memesearch-worker:latest
  restart: unless-stopped
  init: true
  env_file: .env
  volumes:
    - ${MEDIA_HOST_DIR:-./data/media}:/media
    - ms_data:/data
  security_opt:
    - seccomp=./worker/seccomp-userns.json
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: memesearch-web:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ${MEDIA_HOST_DIR:-./data/media}:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    <<: *python
    command: ["uvicorn", "memesearch.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--no-access-log"]
    mem_limit: ${ML_MEM_LIMIT:-6g}
    cpu_shares: ${ML_CPU_SHARES:-512}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *python
    command: ["python", "-m", "memesearch.worker"]
    stop_grace_period: 45s
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    cpu_shares: ${WORKER_CPU_SHARES:-256}
    pids_limit: 4096

  bot:
    <<: *python
    command: ["python", "-m", "memesearch.bot"]
    mem_limit: 1g

volumes:
  pg_data:
  redis_data:
  ms_data:
