name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal db web)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  python:
    name: Python worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies without the ML stack
        run: |
          grep -vE '^(torch|transformers|sentence-transformers|faster-whisper)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest==9.1.1 ruff==0.16.9
      - run: ruff check memesearch tests
      - run: ruff format --check memesearch tests
      - run: python -m compileall -q memesearch
      - run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in web/static/js/*.js; do node --check "$f"; done

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memesearch
          POSTGRES_PASSWORD: memesearch
          POSTGRES_DB: memesearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memesearch"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://memesearch:memesearch@localhost:5432/memesearch?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      WEB_ADDR: 127.0.0.1:8080
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOAD_DIR: ${{ runner.temp }}/media
      SERVE_MEDIA: "true"
      COOKIE_SECURE: "false"
      ADMIN_PASSWORD: ci-password
      ADMIN_API_TOKEN: ci-token
      INTERNAL_TOKEN: ci-internal
      ML_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o memesearch ./cmd/memesearch
      - run: bash .github/scripts/smoke.sh

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          load: true
          tags: memesearch-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Worker image imports every service module
        run: >-
          docker run --rm -e DATABASE_URL=postgres://x -e INTERNAL_TOKEN=x memesearch-worker:ci
          python -c "import memesearch.worker, memesearch.api, memesearch.bot, memesearch.embeddings, memesearch.transcribe; print('ok')"
